<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Nix Manager</title>
  <defs>
    <linearGradient id="tile" x1="24" y1="16" x2="232" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6fa8ff"/>
      <stop offset="1" stop-color="#9d86ff"/>
    </linearGradient>
    <linearGradient id="shine" x1="128" y1="16" x2="128" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- One arm of the snowflake, pointing up from the centre. -->
    <g id="arm" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M128 128 V50"/>
      <path d="M106 70 L128 92 L150 70"/>
    </g>
  </defs>

  <rect x="12" y="12" width="232" height="232" rx="58" fill="url(#tile)"/>
  <rect x="12" y="12" width="232" height="232" rx="58" fill="url(#shine)"/>

  <g stroke="#ffffff" stroke-width="13" fill="none">
    <use href="#arm"/>
    <use href="#arm" transform="rotate(60 128 128)"/>
    <use href="#arm" transform="rotate(120 128 128)"/>
    <use href="#arm" transform="rotate(180 128 128)"/>
    <use href="#arm" transform="rotate(240 128 128)"/>
    <use href="#arm" transform="rotate(300 128 128)"/>
  </g>
  <circle cx="128" cy="128" r="11" fill="#ffffff"/>
</svg>
