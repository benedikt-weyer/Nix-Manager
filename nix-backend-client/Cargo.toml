[package]
name = "nix-backend-client"
version = "0.1.0"
edition = "2021"
description = "Frontend-agnostic gRPC client for the Nix-Manager backend (nix-backend-generic)"
license = "GPL-3.0-only"

[dependencies]
tonic = "0.11"
prost = "0.12"
tokio = { version = "1", features = ["net"] }
tower = "0.4"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tonic-build = "0.11"
