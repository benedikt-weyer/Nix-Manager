[package]
name = "nix-backend-generic"
version = "0.1.0"
edition = "2021"
description = "Generic nix flake update / rebuild backend for caelestia-shell-iron, exposed over gRPC"
license = "GPL-3.0-only"

[[bin]]
name = "nix-backend-generic"
path = "src/main.rs"

[dependencies]
tonic = "0.11"
prost = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "net", "fs", "signal"] }
tokio-stream = { version = "0.1", features = ["net"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tonic-build = "0.11"
