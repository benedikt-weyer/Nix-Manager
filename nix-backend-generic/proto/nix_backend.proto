syntax = "proto3";

// Local IPC contract between the shell (a grpc++ client, see
// plugin/src/Caelestia/Services/NixBackend) and nix-backend-generic (the
// tonic server implementing this service). Served over a unix socket, never
// a network port - see src/main.rs.
package caelestia.nixbackend.v1;

service NixBackend {
    // Runs `nix flake update` against the configured flake, streaming
    // progress as it happens.
    rpc UpdateFlake(UpdateFlakeRequest) returns (stream ProgressEvent);

    // Builds the named nixosConfiguration, diffs it against the running
    // system, then (unless mode is BUILD_ONLY or TEST) registers it as a system
    // generation and (unless mode is BUILD_ONLY) activates it. The privileged
    // steps go through polkit (pkexec) - the daemon itself never runs as root.
    // SWITCH and BOOT register and activate under a single authorization, TEST
    // activates under one, BUILD_ONLY needs none.
    rpc Rebuild(RebuildRequest) returns (stream ProgressEvent);

    // Stops the running operation: kills a running nix, the build included
    // when it runs as root. Fails with FAILED_PRECONDITION when nothing is
    // running, or when the operation has reached registering and activating
    // the system, which must not be interrupted halfway. The operation's
    // stream then ends with a FAILED event whose message is "Cancelled".
    rpc CancelOperation(CancelOperationRequest) returns (CancelOperationReply);

    // Reports when the flake was last changed, from git history.
    rpc GetFlakeStatus(FlakeStatusRequest) returns (FlakeStatusReply);

    // Streams every event of every operation, no matter which client started
    // it. This is how several frontends attached to the same backend stay in
    // sync: a late subscriber first receives the latest event of an operation
    // that is already running, then everything after it. Never ends on its
    // own.
    rpc Watch(WatchRequest) returns (stream OperationEvent);

    // Searches the nixpkgs the target flake has locked (so results match what
    // a rebuild would install, not whatever the registry points at today).
    // The first search against a new nixpkgs revision evaluates all of it and
    // can take a while; later ones are served from nix's evaluation cache.
    rpc SearchPackages(SearchPackagesRequest) returns (SearchPackagesReply);

    // Full details of one package from that same nixpkgs.
    rpc GetPackage(GetPackageRequest) returns (Package);

    // The packages the target's NixOS configuration installs: system
    // packages, per-user packages and (when used) home-manager packages.
    rpc ListInstalledPackages(ListInstalledRequest) returns (ListInstalledReply);

    // The files in the config directory that Nix Manager writes packages
    // into. The default one is always listed, whether or not it exists yet.
    rpc ListDestinations(ListDestinationsRequest) returns (ListDestinationsReply);

    // Creates another such file.
    rpc CreateDestination(CreateDestinationRequest) returns (Destination);

    // Adds a package to, or removes it from, one of those files. Adding to a
    // default destination that doesn't exist yet creates it.
    rpc SetConfigPackage(SetConfigPackageRequest) returns (SetConfigPackageReply);

    // The state of the git repository the config directory belongs to: its
    // branch and every staged, unstaged and untracked file.
    rpc GitStatus(GitStatusRequest) returns (GitStatusReply);

    // Stages or unstages files (all of them when `paths` is empty) and
    // returns the status afterwards.
    rpc GitSetStaged(GitSetStagedRequest) returns (GitStatusReply);

    // Commits what is staged.
    rpc GitCommit(GitCommitRequest) returns (GitCommitReply);

    // The changes to one file as a unified diff.
    rpc GitDiff(GitDiffRequest) returns (GitDiffReply);

    // Which bootloader the running system installs, how full its partition is
    // and which system generations exist. Needs no privileges.
    rpc GetBootInfo(BootInfoRequest) returns (BootInfo);

    // Lists what is on the boot partition and which of it the loader's menu
    // still uses. The partition is usually readable by root only, so this asks
    // for authorization (polkit) unless the user can read it anyway.
    rpc ScanBoot(ScanBootRequest) returns (BootScan);

    // Frees space on the boot partition and prunes its menu, under a single
    // authorization. Takes the operation slot, so it is rejected while an
    // update or rebuild runs (and the other way round).
    rpc MaintainBoot(MaintainBootRequest) returns (MaintainBootReply);

    // Inspects the Secure Boot signing key and what it signed. The key
    // directory is root-only, so this asks for authorization. Only r-boot's keys
    // are managed from here.
    rpc ScanSigning(ScanSigningRequest) returns (SigningScan);

    // Creates, replaces or removes the signing key and/or signs the bootloader
    // (which reinstalls it), under a single authorization. Takes the operation
    // slot like MaintainBoot.
    rpc ManageSigning(ManageSigningRequest) returns (ManageSigningReply);
}

// Only one UpdateFlake/Rebuild runs at a time per backend. Starting another
// while one is in flight fails with FAILED_PRECONDITION.

// Identifies which flake/host to operate on. Either field left empty falls
// back to the daemon's own resolution (NIX_BACKEND_CONFIG_DIR /
// NIX_BACKEND_HOST_NAME env vars, then /etc/nixos + `hostname`).
message SystemTarget {
    string config_dir = 1;
    string host_name = 2;
}

enum RebuildMode {
    REBUILD_MODE_UNSPECIFIED = 0;
    SWITCH = 1;
    BOOT = 2;
    TEST = 3;
    // Build and diff only: nothing is registered as a system generation, the
    // bootloader is untouched and the running system is not activated.
    BUILD_ONLY = 4;
}

message UpdateFlakeRequest {
    SystemTarget target = 1;
}

message RebuildRequest {
    SystemTarget target = 1;
    RebuildMode mode = 2;
    // Extra arguments for `nix build`, e.g. ["--option", "download-attempts",
    // "10"]; how the download behaves on a flaky connection.
    repeated string nix_args = 3;
    // Run `nix build` as root through pkexec. The nix daemon only honors
    // settings like download-attempts from trusted users, and root is one.
    // Unset (e.g. an older client) builds as the calling user.
    bool build_as_root = 4;
}

message FlakeStatusRequest {
    SystemTarget target = 1;
}

message FlakeStatusReply {
    bool has_git_history = 1;
    // RFC 3339 / ISO 8601, empty if has_git_history is false
    string last_modified_iso8601 = 2;
    string last_commit_subject = 3;
    string last_commit_hash = 4;
    // The target that was actually used, after falling back to the daemon's
    // own defaults for whatever the request left empty - so a frontend can
    // show what "default" means.
    string resolved_config_dir = 5;
    string resolved_host_name = 6;
}

enum EventPhase {
    PHASE_UNSPECIFIED = 0;
    STARTED = 1;
    FLAKE_UPDATE = 2;
    BUILD = 3;
    DIFF = 4;
    REGISTER = 5;
    ACTIVATE = 6;
    FINISHED = 7;
    FAILED = 8;
}

enum BuildItemKind {
    BUILD_ITEM_KIND_UNSPECIFIED = 0;
    BUILD_ITEM_BUILD = 1;
    BUILD_ITEM_DOWNLOAD = 2;
}

enum BuildItemStatus {
    BUILD_ITEM_STATUS_UNSPECIFIED = 0;
    BUILD_ITEM_RUNNING = 1;
    BUILD_ITEM_DONE = 2;
}

// One derivation build or substitution download that's currently (or very
// recently) in flight, derived from nix's own `--log-format internal-json`
// activity stream (see nix-backend-generic/src/activity.rs). Nix doesn't
// expose the full upfront dependency graph cheaply, so this is a live view
// of what's actually running/just finished, not a precomputed plan.
message BuildItem {
    // The activity id nix assigned this item, stable for its lifetime.
    uint64 id = 1;
    BuildItemKind kind = 2;
    BuildItemStatus status = 3;
    // Derivation or store-path name, e.g. "hello-2.12.1".
    string name = 4;
    // Bytes transferred so far - only meaningful for downloads.
    double bytes_done = 5;
    // Expected total bytes - 0 if unknown.
    double bytes_expected = 6;
    double bytes_per_sec = 7;
}

// Aggregate counts nix itself reports for the whole build/substitution
// graph, so the shell can show "N built, M downloading, K waiting" without
// having to walk the dependency graph itself.
message BuildStats {
    int64 builds_done = 1;
    int64 builds_expected = 2;
    int64 builds_running = 3;
    int64 builds_failed = 4;
    int64 copies_done = 5;
    int64 copies_expected = 6;
    int64 copies_running = 7;
    int64 copies_failed = 8;
    int64 download_bytes_done = 9;
    int64 download_bytes_expected = 10;
    // Smoothed combined throughput of all running downloads, 0 when idle.
    double download_bytes_per_sec = 11;
}

message ProgressEvent {
    EventPhase phase = 1;
    // Human-readable status line for display in the shell's log view.
    string message = 2;
    bool is_error = 3;
    // 0..1 when derivable from nix's own progress reporting, -1 otherwise.
    double fraction_done = 4;
    // Current snapshot of in-flight/recently-finished builds and downloads.
    repeated BuildItem active_items = 5;
    BuildStats stats = 6;
}

message WatchRequest {}

message CancelOperationRequest {}

message CancelOperationReply {}

enum OperationKind {
    OPERATION_KIND_UNSPECIFIED = 0;
    UPDATE_FLAKE = 1;
    REBUILD = 2;
    // Only holds the operation slot; never streamed through Watch.
    BOOT_MAINTENANCE = 3;
}

// A ProgressEvent tagged with the operation it belongs to, so a client that
// didn't start the operation can still tell what is running.
message OperationEvent {
    OperationKind kind = 1;
    // Only meaningful when kind is REBUILD.
    RebuildMode mode = 2;
    ProgressEvent event = 3;
}

message SearchPackagesRequest {
    SystemTarget target = 1;
    // Whitespace separated words, all of which must match the package's name,
    // attribute or description. Matched literally, not as a regex.
    string query = 2;
    // Maximum number of packages returned; 0 means the backend's default.
    uint32 limit = 3;
}

// What a search result shows; `GetPackage` has the rest.
message PackageSummary {
    // Attribute path inside nixpkgs, e.g. "hello" or "kdePackages.kate".
    string attr = 1;
    string pname = 2;
    string version = 3;
    string description = 4;
}

message SearchPackagesReply {
    // Best matches first.
    repeated PackageSummary packages = 1;
    // How many packages matched in total, before the limit was applied.
    uint32 total_matches = 2;
    // Which nixpkgs was searched, for display, e.g. "nixpkgs @ 31ecbac".
    string source = 3;
}

message GetPackageRequest {
    SystemTarget target = 1;
    string attr = 2;
}

message Maintainer {
    string name = 1;
    // GitHub user name, empty if the maintainer has none.
    string github = 2;
}

message Package {
    // Empty for installed packages, where nixpkgs' attribute isn't known.
    string attr = 1;
    // "hello-2.12.3"
    string name = 2;
    string pname = 3;
    string version = 4;
    string description = 5;
    string long_description = 6;
    string homepage = 7;
    repeated string licenses = 8;
    repeated Maintainer maintainers = 9;
    string main_program = 10;
    // Where the package is defined, relative to the nixpkgs root, e.g.
    // "pkgs/by-name/he/hello/package.nix". Empty when unknown.
    string source_path = 11;
    uint32 source_line = 12;
    // The definition on GitHub, pinned to the locked nixpkgs revision.
    // Empty when the package doesn't come from nixpkgs.
    string source_url = 13;
}

message ListInstalledRequest {
    SystemTarget target = 1;
}

message ListInstalledReply {
    // Sorted by name, without duplicates.
    repeated Package packages = 1;
}

// A NixOS module in the config directory, `nix-manager-<name>.nix`, whose
// `environment.systemPackages` Nix Manager maintains. Only the lines between
// its marker comments are touched; the rest of the file belongs to the user.
message Destination {
    // File name inside the config directory, e.g. "nix-manager-config.nix".
    string file = 1;
    // Where it is (or would be) on disk.
    string path = 2;
    bool exists = 3;
    // The one packages go to unless another is chosen.
    bool is_default = 4;
    // Whether another .nix file in the config directory mentions this one, which
    // is how an import shows up. A guess: nix itself is not asked.
    bool imported = 5;
    // Nixpkgs attributes listed in it, e.g. "hello" or "kdePackages.kate".
    repeated string packages = 6;
}

message ListDestinationsRequest {
    SystemTarget target = 1;
}

message ListDestinationsReply {
    // The default first, then the rest by name.
    repeated Destination destinations = 1;
}

message CreateDestinationRequest {
    SystemTarget target = 1;
    // A short name such as "gaming"; it becomes "nix-manager-gaming.nix".
    string name = 2;
}

message SetConfigPackageRequest {
    SystemTarget target = 1;
    // A destination's file name.
    string file = 2;
    // A nixpkgs attribute.
    string attr = 3;
    // true adds the package, false removes it.
    bool present = 4;
}

message SetConfigPackageReply {
    Destination destination = 1;
    // The file was new to git, and was staged so that flakes can see it
    // (a flake only reads files git knows about).
    bool staged_in_git = 2;
}

// ---------------------------------------------------------------- git --
// Everything below works on the git repository that contains the config
// directory, and is the same whether or not that is the directory itself.

enum GitChange {
    GIT_CHANGE_NONE = 0;
    GIT_CHANGE_ADDED = 1;
    GIT_CHANGE_MODIFIED = 2;
    GIT_CHANGE_DELETED = 3;
    GIT_CHANGE_RENAMED = 4;
    GIT_CHANGE_COPIED = 5;
    GIT_CHANGE_TYPE_CHANGED = 6;
    // Not known to git at all. Only ever an unstaged change.
    GIT_CHANGE_UNTRACKED = 7;
    // A merge conflict. Only ever an unstaged change.
    GIT_CHANGE_CONFLICTED = 8;
}

// One file with changes. A file can be in both lists at once: staged, and
// then changed again.
message GitFile {
    // Relative to the repository root.
    string path = 1;
    // Where a renamed or copied file came from; empty otherwise.
    string old_path = 2;
    // What is staged for the next commit; NONE if nothing is.
    GitChange staged = 3;
    // What differs between the index and the working tree; NONE if nothing.
    GitChange unstaged = 4;
}

message GitStatusRequest {
    SystemTarget target = 1;
}

message GitStatusReply {
    // False when the config directory isn't inside a git repository; the
    // rest of the reply is empty then.
    bool is_repo = 1;
    string repo_root = 2;
    // Empty when HEAD is detached.
    string branch = 3;
    bool detached = 4;
    // The branch it tracks, e.g. "origin/main"; empty if none.
    string upstream = 5;
    uint32 ahead = 6;
    uint32 behind = 7;
    // Sorted by path.
    repeated GitFile files = 8;
}

message GitSetStagedRequest {
    SystemTarget target = 1;
    // Relative to the repository root. Empty means every file.
    repeated string paths = 2;
    // true stages, false unstages.
    bool staged = 3;
}

message GitCommitRequest {
    SystemTarget target = 1;
    string message = 2;
}

message GitCommitReply {
    // Abbreviated hash of the new commit.
    string hash = 1;
    string subject = 2;
}

message GitDiffRequest {
    SystemTarget target = 1;
    string path = 2;
    // For a renamed file, where it was, so that the diff shows a rename
    // rather than a new file.
    string old_path = 3;
    // true for what is staged (index against HEAD), false for what is not
    // (working tree against index; a new file against nothing).
    bool staged = 4;
}

message GitDiffReply {
    // Unified diff text; empty if there is nothing to show.
    string text = 1;
    // The diff was cut off because it is too large.
    bool truncated = 2;
}

// --------------------------------------------------------------- boot --

enum Bootloader {
    BOOTLOADER_UNKNOWN = 0;
    BOOTLOADER_R_BOOT = 1;
    BOOTLOADER_SYSTEMD_BOOT = 2;
    BOOTLOADER_GRUB = 3;
}

message BootInfoRequest {}

// One system generation: an entry of /nix/var/nix/profiles/system.
message BootGeneration {
    uint64 number = 1;
    string store_path = 2;
    // e.g. "NixOS 26.11.20261121.2786a2a (Linux 6.18.64)"
    string label = 3;
    // When the generation was registered, seconds since the epoch.
    int64 created_unix = 4;
    // The one the system profile points at, so the next boot's default.
    bool current = 5;
    // The one the machine was booted into.
    bool booted = 6;
    // The one that is activated right now.
    bool running = 7;
    // The kernel and initrd in the Nix store, which the bootloader copies
    // (or, for some setups, points at).
    string kernel = 8;
    string initrd = 9;
    // Their sizes together.
    uint64 boot_bytes = 10;
}

message BootInfo {
    Bootloader bootloader = 1;
    // The script that installs the bootloader on every rebuild; empty when it
    // could not be found.
    string installer = 2;
    string mount_point = 3;
    // False when the mount point is only a directory on another file system
    // (usually the root one); the sizes then describe that file system.
    bool is_mount = 4;
    string device = 5;
    string fs_type = 6;
    uint64 total_bytes = 7;
    uint64 used_bytes = 8;
    uint64 free_bytes = 9;
    // The partition can be listed without authorization.
    bool listable = 10;
    // How many older generations the bootloader keeps besides the current one;
    // 0 when that is not known.
    uint32 generation_limit = 11;
    // Where the loader keeps kernels and initrds, relative to the mount point;
    // empty when it keeps none there.
    string kernel_dir = 12;
    // Newest first.
    repeated BootGeneration generations = 13;
    SigningInfo signing = 14;
}

message ScanBootRequest {}

enum BootFileState {
    // Not something the loader's menu manages (the loader itself, its
    // configuration, other systems).
    BOOT_FILE_STATE_OTHER = 0;
    // A kernel or initrd some menu entry uses.
    BOOT_FILE_STATE_IN_USE = 1;
    // A kernel or initrd no menu entry uses: safe to delete.
    BOOT_FILE_STATE_STALE = 2;
    // A copy that was never finished, left behind by a failed run.
    BOOT_FILE_STATE_PARTIAL = 3;
}

message BootFile {
    // Relative to the mount point.
    string path = 1;
    uint64 size = 2;
    int64 modified_unix = 3;
    BootFileState state = 4;
    // Ids of the menu entries that use it.
    repeated string used_by = 5;
}

message BootEntry {
    string id = 1;
    string title = 2;
    // The system generation it boots; 0 when that is not known.
    uint64 generation = 3;
    bool is_default = 4;
    // The files it loads from the partition, relative to the mount point.
    repeated string files = 5;
}

message BootScan {
    // The partition was read with authorization.
    bool elevated = 1;
    // Largest first.
    repeated BootFile files = 2;
    repeated BootEntry entries = 3;
}

message MaintainBootRequest {
    // Files to delete, relative to the mount point. Only kernels and initrds
    // directly inside the loader's kernel directory are accepted.
    repeated string delete_files = 1;
    // System generations to delete. The current and the booted one are refused.
    // Deleting generations always reinstalls the bootloader, so that their
    // menu entries go away too.
    repeated uint64 delete_generations = 2;
    // Run the bootloader installer again (`switch-to-configuration boot`),
    // which rewrites the menu from the generations that are left.
    bool reinstall = 3;
}

message MaintainBootReply {
    // What the privileged steps printed.
    string output = 1;
}

// ------------------------------------------------------------ signing --

enum SecureBootState {
    // Not booted through UEFI, or the firmware doesn't say.
    SECURE_BOOT_STATE_UNKNOWN = 0;
    SECURE_BOOT_STATE_DISABLED = 1;
    SECURE_BOOT_STATE_ENABLED = 2;
}

// What can be told about signing without authorization.
message SigningInfo {
    SecureBootState secure_boot = 1;
    // The firmware has no platform key and accepts new ones.
    bool setup_mode = 2;
    // The bootloader's installer signs the bootloader on every rebuild (for
    // r-boot: boot.loader.r-boot.sign-bootloader).
    bool signs_bootloader = 3;
    // The keys can be managed from here: r-boot, with its CLI installed.
    bool manageable = 4;
    // The r-boot-cli that does it; empty when it isn't installed.
    string tool = 5;
    // Where the installer looks for the private key and the certificate.
    string key_path = 6;
    string cert_path = 7;
    // How many certificates the firmware's signature database (db) holds.
    uint32 firmware_certs = 8;
}

enum SigningCheck {
    SIGNING_CHECK_UNKNOWN = 0;
    SIGNING_CHECK_NO = 1;
    SIGNING_CHECK_YES = 2;
}

message ScanSigningRequest {}

message SigningScan {
    bool key_present = 1;
    bool cert_present = 2;
    string cert_subject = 3;
    // As OpenSSL prints it, e.g. "Nov 21 10:00:00 2036 GMT".
    string cert_not_after = 4;
    // SHA-256, colon-separated.
    string cert_fingerprint = 5;
    bool bootloader_installed = 6;
    // The installed bootloader carries a signature.
    SigningCheck bootloader_signed = 7;
    // ... made with the certificate above.
    SigningCheck signed_with_cert = 8;
    // The certificate is in the firmware's signature database, so the firmware
    // will start what it signed.
    SigningCheck enrolled = 9;
    // What `r-boot-cli status` printed.
    string output = 10;
}

enum SigningAction {
    SIGNING_ACTION_NONE = 0;
    // Generates a key and certificate; fails when there already is one.
    SIGNING_ACTION_CREATE_KEY = 1;
    // Generates new ones in place of the old. The firmware has to learn the new
    // certificate again. Refused while Secure Boot is on.
    SIGNING_ACTION_REPLACE_KEY = 2;
    // Deletes the key for good. Refused while Secure Boot is on, and while the
    // installer is set to sign (every rebuild would then fail).
    SIGNING_ACTION_REMOVE_KEY = 3;
}

message ManageSigningRequest {
    SigningAction action = 1;
    // Run the installer again, which signs the bootloader with the key as it
    // is after `action`.
    bool sign_bootloader = 2;
}

message ManageSigningReply {
    string output = 1;
}
