syntax = "proto3";

// Local IPC contract between the shell (a grpc++ client, see
// plugin/src/Caelestia/Services/NixBackend) and nix-backend-generic (the
// tonic server implementing this service). Served over a unix socket, never
// a network port - see src/main.rs.
package caelestia.nixbackend.v1;

service NixBackend {
    // Runs `nix flake update` against the configured flake, streaming
    // progress as it happens.
    rpc UpdateFlake(UpdateFlakeRequest) returns (stream ProgressEvent);

    // Builds the named nixosConfiguration, diffs it against the running
    // system, then (unless mode is BUILD_ONLY or TEST) registers it as a system
    // generation and (unless mode is BUILD_ONLY) activates it. The privileged
    // steps go through polkit (pkexec) - the daemon itself never runs as root.
    // SWITCH and BOOT register and activate under a single authorization, TEST
    // activates under one, BUILD_ONLY needs none.
    rpc Rebuild(RebuildRequest) returns (stream ProgressEvent);

    // Reports when the flake was last changed, from git history.
    rpc GetFlakeStatus(FlakeStatusRequest) returns (FlakeStatusReply);

    // Streams every event of every operation, no matter which client started
    // it. This is how several frontends attached to the same backend stay in
    // sync: a late subscriber first receives the latest event of an operation
    // that is already running, then everything after it. Never ends on its
    // own.
    rpc Watch(WatchRequest) returns (stream OperationEvent);

    // Searches the nixpkgs the target flake has locked (so results match what
    // a rebuild would install, not whatever the registry points at today).
    // The first search against a new nixpkgs revision evaluates all of it and
    // can take a while; later ones are served from nix's evaluation cache.
    rpc SearchPackages(SearchPackagesRequest) returns (SearchPackagesReply);

    // Full details of one package from that same nixpkgs.
    rpc GetPackage(GetPackageRequest) returns (Package);

    // The packages the target's NixOS configuration installs: system
    // packages, per-user packages and (when used) home-manager packages.
    rpc ListInstalledPackages(ListInstalledRequest) returns (ListInstalledReply);

    // The files in the config directory that Nix Manager writes packages
    // into. The default one is always listed, whether or not it exists yet.
    rpc ListDestinations(ListDestinationsRequest) returns (ListDestinationsReply);

    // Creates another such file.
    rpc CreateDestination(CreateDestinationRequest) returns (Destination);

    // Adds a package to, or removes it from, one of those files. Adding to a
    // default destination that doesn't exist yet creates it.
    rpc SetConfigPackage(SetConfigPackageRequest) returns (SetConfigPackageReply);
}

// Only one UpdateFlake/Rebuild runs at a time per backend. Starting another
// while one is in flight fails with FAILED_PRECONDITION.

// Identifies which flake/host to operate on. Either field left empty falls
// back to the daemon's own resolution (NIX_BACKEND_CONFIG_DIR /
// NIX_BACKEND_HOST_NAME env vars, then /etc/nixos + `hostname`).
message SystemTarget {
    string config_dir = 1;
    string host_name = 2;
}

enum RebuildMode {
    REBUILD_MODE_UNSPECIFIED = 0;
    SWITCH = 1;
    BOOT = 2;
    TEST = 3;
    // Build and diff only: nothing is registered as a system generation, the
    // bootloader is untouched and the running system is not activated.
    BUILD_ONLY = 4;
}

message UpdateFlakeRequest {
    SystemTarget target = 1;
}

message RebuildRequest {
    SystemTarget target = 1;
    RebuildMode mode = 2;
}

message FlakeStatusRequest {
    SystemTarget target = 1;
}

message FlakeStatusReply {
    bool has_git_history = 1;
    // RFC 3339 / ISO 8601, empty if has_git_history is false
    string last_modified_iso8601 = 2;
    string last_commit_subject = 3;
    string last_commit_hash = 4;
    // The target that was actually used, after falling back to the daemon's
    // own defaults for whatever the request left empty - so a frontend can
    // show what "default" means.
    string resolved_config_dir = 5;
    string resolved_host_name = 6;
}

enum EventPhase {
    PHASE_UNSPECIFIED = 0;
    STARTED = 1;
    FLAKE_UPDATE = 2;
    BUILD = 3;
    DIFF = 4;
    REGISTER = 5;
    ACTIVATE = 6;
    FINISHED = 7;
    FAILED = 8;
}

enum BuildItemKind {
    BUILD_ITEM_KIND_UNSPECIFIED = 0;
    BUILD_ITEM_BUILD = 1;
    BUILD_ITEM_DOWNLOAD = 2;
}

enum BuildItemStatus {
    BUILD_ITEM_STATUS_UNSPECIFIED = 0;
    BUILD_ITEM_RUNNING = 1;
    BUILD_ITEM_DONE = 2;
}

// One derivation build or substitution download that's currently (or very
// recently) in flight, derived from nix's own `--log-format internal-json`
// activity stream (see nix-backend-generic/src/activity.rs). Nix doesn't
// expose the full upfront dependency graph cheaply, so this is a live view
// of what's actually running/just finished, not a precomputed plan.
message BuildItem {
    // The activity id nix assigned this item, stable for its lifetime.
    uint64 id = 1;
    BuildItemKind kind = 2;
    BuildItemStatus status = 3;
    // Derivation or store-path name, e.g. "hello-2.12.1".
    string name = 4;
    // Bytes transferred so far - only meaningful for downloads.
    double bytes_done = 5;
    // Expected total bytes - 0 if unknown.
    double bytes_expected = 6;
    double bytes_per_sec = 7;
}

// Aggregate counts nix itself reports for the whole build/substitution
// graph, so the shell can show "N built, M downloading, K waiting" without
// having to walk the dependency graph itself.
message BuildStats {
    int64 builds_done = 1;
    int64 builds_expected = 2;
    int64 builds_running = 3;
    int64 builds_failed = 4;
    int64 copies_done = 5;
    int64 copies_expected = 6;
    int64 copies_running = 7;
    int64 copies_failed = 8;
    int64 download_bytes_done = 9;
    int64 download_bytes_expected = 10;
    // Smoothed combined throughput of all running downloads, 0 when idle.
    double download_bytes_per_sec = 11;
}

message ProgressEvent {
    EventPhase phase = 1;
    // Human-readable status line for display in the shell's log view.
    string message = 2;
    bool is_error = 3;
    // 0..1 when derivable from nix's own progress reporting, -1 otherwise.
    double fraction_done = 4;
    // Current snapshot of in-flight/recently-finished builds and downloads.
    repeated BuildItem active_items = 5;
    BuildStats stats = 6;
}

message WatchRequest {}

enum OperationKind {
    OPERATION_KIND_UNSPECIFIED = 0;
    UPDATE_FLAKE = 1;
    REBUILD = 2;
}

// A ProgressEvent tagged with the operation it belongs to, so a client that
// didn't start the operation can still tell what is running.
message OperationEvent {
    OperationKind kind = 1;
    // Only meaningful when kind is REBUILD.
    RebuildMode mode = 2;
    ProgressEvent event = 3;
}

message SearchPackagesRequest {
    SystemTarget target = 1;
    // Whitespace separated words, all of which must match the package's name,
    // attribute or description. Matched literally, not as a regex.
    string query = 2;
    // Maximum number of packages returned; 0 means the backend's default.
    uint32 limit = 3;
}

// What a search result shows; `GetPackage` has the rest.
message PackageSummary {
    // Attribute path inside nixpkgs, e.g. "hello" or "kdePackages.kate".
    string attr = 1;
    string pname = 2;
    string version = 3;
    string description = 4;
}

message SearchPackagesReply {
    // Best matches first.
    repeated PackageSummary packages = 1;
    // How many packages matched in total, before the limit was applied.
    uint32 total_matches = 2;
    // Which nixpkgs was searched, for display, e.g. "nixpkgs @ 31ecbac".
    string source = 3;
}

message GetPackageRequest {
    SystemTarget target = 1;
    string attr = 2;
}

message Maintainer {
    string name = 1;
    // GitHub user name, empty if the maintainer has none.
    string github = 2;
}

message Package {
    // Empty for installed packages, where nixpkgs' attribute isn't known.
    string attr = 1;
    // "hello-2.12.3"
    string name = 2;
    string pname = 3;
    string version = 4;
    string description = 5;
    string long_description = 6;
    string homepage = 7;
    repeated string licenses = 8;
    repeated Maintainer maintainers = 9;
    string main_program = 10;
    // Where the package is defined, relative to the nixpkgs root, e.g.
    // "pkgs/by-name/he/hello/package.nix". Empty when unknown.
    string source_path = 11;
    uint32 source_line = 12;
    // The definition on GitHub, pinned to the locked nixpkgs revision.
    // Empty when the package doesn't come from nixpkgs.
    string source_url = 13;
}

message ListInstalledRequest {
    SystemTarget target = 1;
}

message ListInstalledReply {
    // Sorted by name, without duplicates.
    repeated Package packages = 1;
}

// A NixOS module in the config directory, `nix-manager-<name>.nix`, whose
// `environment.systemPackages` Nix Manager maintains. Only the lines between
// its marker comments are touched; the rest of the file belongs to the user.
message Destination {
    // File name inside the config directory, e.g. "nix-manager-config.nix".
    string file = 1;
    // Where it is (or would be) on disk.
    string path = 2;
    bool exists = 3;
    // The one packages go to unless another is chosen.
    bool is_default = 4;
    // Whether another .nix file in the config directory mentions this one, which
    // is how an import shows up. A guess: nix itself is not asked.
    bool imported = 5;
    // Nixpkgs attributes listed in it, e.g. "hello" or "kdePackages.kate".
    repeated string packages = 6;
}

message ListDestinationsRequest {
    SystemTarget target = 1;
}

message ListDestinationsReply {
    // The default first, then the rest by name.
    repeated Destination destinations = 1;
}

message CreateDestinationRequest {
    SystemTarget target = 1;
    // A short name such as "gaming"; it becomes "nix-manager-gaming.nix".
    string name = 2;
}

message SetConfigPackageRequest {
    SystemTarget target = 1;
    // A destination's file name.
    string file = 2;
    // A nixpkgs attribute.
    string attr = 3;
    // true adds the package, false removes it.
    bool present = 4;
}

message SetConfigPackageReply {
    Destination destination = 1;
    // The file was new to git, and was staged so that flakes can see it
    // (a flake only reads files git knows about).
    bool staged_in_git = 2;
}
